<!-- @startingPoint section="Kindello Web" subtitle="Full childcare-directory website (home, results, detail)" viewport="1280x900" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kindello — childcare directory</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/brand/favicons/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="../../assets/brand/favicons/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="../../assets/brand/favicons/apple-touch-icon.png" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--bg); }
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  #screen { flex: 1; }
  .hero-caret { display: inline-block; width: 2px; height: 1.05em; background: var(--teal-500); margin-left: 2px; vertical-align: -0.16em; animation: hero-blink 1.05s steps(1) infinite; }
  @keyframes hero-blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .hero-caret { display: none; } }
</style>
</head>
<body>
  <div id="app"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="HomePage.jsx"></script>
  <script type="text/babel" src="ResultsPage.jsx"></script>
  <script type="text/babel" src="DetailPage.jsx"></script>
  <script type="text/babel">
    const { Header, Footer, HomePage, ResultsPage, DetailPage } = window;

    function App() {
      const [screen, setScreen] = React.useState("home");
      const navigate = (s) => { setScreen(s); window.scrollTo({ top: 0 }); };
      const Page = screen === "results" ? ResultsPage : screen === "detail" ? DetailPage : HomePage;
      return (
        <div id="app">
          <Header navigate={navigate} active={screen} />
          <div id="screen"><Page navigate={navigate} /></div>
          <Footer />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("app")).render(<App />);
  </script>
</body>
</html>
