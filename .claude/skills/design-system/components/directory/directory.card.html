<!-- @dsCard group="Components" viewport="700x720" name="Directory — Cards & Tiles" subtitle="CentreCard (featured + grid), CategoryTile, GuideCard" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg); }
  .lab { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .blk { margin-bottom: 26px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { CentreCard, CategoryTile, GuideCard } = window.KindelloDesignSystem_c65c52;
    function Demo() {
      return (
        <div>
          <div className="blk">
            <p className="lab">CentreCard — featured (enlarged)</p>
            <CentreCard featured seed={0} />
          </div>
          <div className="blk">
            <p className="lab">CentreCard — compact grid</p>
            <div className="grid3">
              <CentreCard seed={1} name="Sunshine Cottage" suburb="Newtown" distance="2.1 km" rating={4.6} reviews={88} nqs="Meeting NQS" tags={["Long day care","Ages 0–5"]} keyInfo="Waitlist only" />
              <CentreCard seed={2} name="Banksia House" suburb="Carlton" distance="0.8 km" rating={4.9} reviews={203} nqs="Excellent" tags={["Preschool","Organic meals"]} />
              <CentreCard seed={3} name="Little Wattle" suburb="Fremantle" distance="3.4 km" rating={4.4} reviews={51} nqs="Exceeding NQS" tags={["Family day care"]} keyInfo="Places available" />
            </div>
          </div>
          <div className="blk">
            <p className="lab">CategoryTile</p>
            <div className="grid4">
              <CategoryTile icon="baby" label="Long Day Care" count={1240} tone="teal" />
              <CategoryTile icon="blocks" label="Montessori" count={142} tone="coral" />
              <CategoryTile icon="graduation-cap" label="Preschool" count={680} tone="sun" />
              <CategoryTile icon="sun" label="Occasional Care" count={96} tone="teal" />
            </div>
          </div>
          <div className="blk">
            <p className="lab">GuideCard</p>
            <div className="grid2">
              <GuideCard seed={0} category="Choosing care" title="How to read an NQS rating" readTime="5 min read" />
              <GuideCard seed={1} category="Costs" title="Understanding the Child Care Subsidy" readTime="6 min read" />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
  </script>
</body>
</html>
