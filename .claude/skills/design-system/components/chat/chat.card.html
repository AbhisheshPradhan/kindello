<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg); }
  .lab { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 12px; }
  .blk { margin-bottom: 28px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { ConversationTabs, ChatComposer, UserBubble, FollowUps, PlaceResultCard, ContinueSearchCard } = window.KindelloDesignSystem_c65c52;
    function Demo() {
      const [tab, setTab] = React.useState("answer");
      return (
        <div>
          <div className="blk">
            <p className="lab">ConversationTabs</p>
            <ConversationTabs active={tab} placesCount={6} onSelect={setTab} onNewSearch={() => {}} />
          </div>
          <div className="blk">
            <p className="lab">UserBubble</p>
            <UserBubble>Long day care for a 2 year old near Surry Hills, exceeding rated with places now</UserBubble>
          </div>
          <div className="blk">
            <p className="lab">ChatComposer — md (follow-up bar)</p>
            <ChatComposer size="md" placeholder="Ask a follow-up…" />
          </div>
          <div className="blk">
            <p className="lab">FollowUps</p>
            <FollowUps items={["Which of these have vacancies for toddlers?", "What's the typical weekly fee after the subsidy?"]} />
          </div>
          <div className="blk">
            <p className="lab">PlaceResultCard</p>
            <div className="grid2">
              <PlaceResultCard seed={0} phone="(02) 9311 4422" />
              <PlaceResultCard seed={2} name="Gumnut Grove" suburb="Darlington" distance="1.1 km" rating={4.8} reviews={95} placesNow="1 place now" verified={false} />
            </div>
          </div>
          <div className="blk">
            <p className="lab">ContinueSearchCard</p>
            <div className="grid2">
              <ContinueSearchCard />
              <ContinueSearchCard query="Family day care in Parramatta open from 7am" summary="4 centres · 2 with places now" when="Last week" pins={[[42,42],[64,56]]} />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
  </script>
</body>
</html>
