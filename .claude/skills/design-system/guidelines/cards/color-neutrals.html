<!-- @dsCard group="Colors" viewport="700x150" name="Warm Neutrals" subtitle="Stone base — page, surface, text, border" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 20px; }
  .row { display: flex; gap: 12px; }
  .cell { flex: 1; }
  .sw { height: 64px; border-radius: var(--radius-md); border: 1px solid var(--border); }
  .nm { font-size: 12px; margin-top: 8px; font-weight: 600; }
  .vr { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><div class="sw" style="background:var(--bg)"></div><div class="nm">Page</div><div class="vr">--bg</div></div>
    <div class="cell"><div class="sw" style="background:var(--surface)"></div><div class="nm">Card</div><div class="vr">--surface</div></div>
    <div class="cell"><div class="sw" style="background:var(--secondary)"></div><div class="nm">Sunk</div><div class="vr">--secondary</div></div>
    <div class="cell"><div class="sw" style="background:var(--border)"></div><div class="nm">Border</div><div class="vr">--border</div></div>
    <div class="cell"><div class="sw" style="background:var(--muted-fg)"></div><div class="nm">Muted text</div><div class="vr">--muted-fg</div></div>
    <div class="cell"><div class="sw" style="background:var(--fg)"></div><div class="nm">Text</div><div class="vr">--fg</div></div>
  </div>
</body>
</html>
