<!-- @dsCard group="Colors" viewport="700x170" name="NQS Rating Badges" subtitle="Quality-rating semantic colours" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .excellent { background: var(--teal-500); color: #fff; }
  .exceeding { background: color-mix(in srgb, var(--teal-500) 15%, transparent); color: var(--teal-700); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--teal-500) 30%, transparent); }
  .meeting { background: color-mix(in srgb, var(--rating-meeting) 12%, transparent); color: var(--rating-meeting); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--rating-meeting) 25%, transparent); }
  .working { background: color-mix(in srgb, var(--rating-working) 14%, transparent); color: var(--rating-working); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--rating-working) 25%, transparent); }
  .improve { background: color-mix(in srgb, var(--rating-improve) 12%, transparent); color: var(--rating-improve); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--rating-improve) 25%, transparent); }
  .na { background: var(--secondary); color: var(--muted-fg); box-shadow: inset 0 0 0 1px var(--border); }
  .cap { width: 100%; font-size: 12px; color: var(--text-muted); margin: 0; }
</style>
</head>
<body>
  <span class="badge excellent">Excellent</span>
  <span class="badge exceeding">Exceeding</span>
  <span class="badge meeting">Meeting</span>
  <span class="badge working">Working towards</span>
  <span class="badge improve">Improvement required</span>
  <span class="badge na">Not yet rated</span>
  <p class="cap">National Quality Standard ratings, best→worst. Drawn straight from the app's <code>ratingBadge()</code> map.</p>
</body>
</html>
