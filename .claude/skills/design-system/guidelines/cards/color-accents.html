<!-- @dsCard group="Colors" viewport="700x150" name="Accents — Coral & Sun" subtitle="Warm CTA + sunny highlight" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 20px; display: flex; gap: 24px; }
  .group { flex: 1; }
  .ramp { display: flex; gap: 0; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 72px; display: flex; align-items: flex-end; padding: 8px; }
  .sw span { font-family: var(--font-mono); font-size: 10px; font-weight: 600; }
  .on { color: #fff; }
  .dk { color: var(--fg); }
  h4 { font-size: 13px; margin-bottom: 10px; }
  .cap { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>
  <div class="group">
    <h4 style="color:var(--coral-500)">Coral — accent / CTA</h4>
    <div class="ramp">
      <div class="sw dk" style="background:var(--coral-100)"><span>100</span></div>
      <div class="sw dk" style="background:var(--coral-200)"><span>200</span></div>
      <div class="sw on" style="background:var(--coral-300)"><span>300</span></div>
      <div class="sw on" style="background:var(--coral-400)"><span>400</span></div>
      <div class="sw on" style="background:var(--coral-500)"><span>500</span></div>
      <div class="sw on" style="background:var(--coral-600)"><span>600</span></div>
    </div>
    <p class="cap"><b>#F9603F</b> — "Enquire", "Places available", warmth.</p>
  </div>
  <div class="group">
    <h4 style="color:var(--sun-500)">Sun — highlight</h4>
    <div class="ramp">
      <div class="sw dk" style="background:var(--sun-100)"><span>100</span></div>
      <div class="sw dk" style="background:var(--sun-200)"><span>200</span></div>
      <div class="sw dk" style="background:var(--sun-300)"><span>300</span></div>
      <div class="sw dk" style="background:var(--sun-400)"><span>400</span></div>
      <div class="sw dk" style="background:var(--sun-500)"><span>500</span></div>
    </div>
    <p class="cap"><b>#FFC83D</b> — star ratings, small highlights, chips.</p>
  </div>
</body>
</html>
