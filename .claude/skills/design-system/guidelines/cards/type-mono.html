<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; display: flex; gap: 28px; align-items: flex-start; }
  .stat { text-align: left; }
  .num { font-family: var(--font-mono); font-size: 30px; font-weight: 600; color: var(--fg); letter-spacing: -0.01em; }
  .lbl { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .div { width: 1px; align-self: stretch; background: var(--border); }
</style>
</head>
<body>
  <div class="stat"><div class="num" style="color:var(--teal-600)">4.8</div><div class="lbl">★ 126 reviews</div></div>
  <div class="div"></div>
  <div class="stat"><div class="num">0–5</div><div class="lbl">Age range</div></div>
  <div class="div"></div>
  <div class="stat"><div class="num">66</div><div class="lbl">Approved places</div></div>
  <div class="div"></div>
  <div class="stat"><div class="num" style="color:var(--coral-500)">3</div><div class="lbl">Places available</div></div>
</body>
</html>
