<!-- @dsCard group="Spacing" viewport="700x170" name="Radius" subtitle="12px base — friendly rounded corners" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; display: flex; gap: 16px; align-items: flex-end; }
  .box { width: 86px; height: 86px; background: var(--teal-100); border: 1.5px solid var(--teal-400); display:flex; align-items:flex-end; justify-content:center; padding-bottom:8px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--teal-700); }
  .pill { width: 130px; height: 44px; border-radius: var(--radius-pill); background: var(--teal-100); border: 1.5px solid var(--teal-400); display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
  <div class="box" style="border-radius:var(--radius-sm)"><span class="lbl">sm 8</span></div>
  <div class="box" style="border-radius:var(--radius-md)"><span class="lbl">md 10</span></div>
  <div class="box" style="border-radius:var(--radius-lg)"><span class="lbl">lg 12</span></div>
  <div class="box" style="border-radius:var(--radius-xl)"><span class="lbl">xl 16</span></div>
  <div class="box" style="border-radius:var(--radius-2xl)"><span class="lbl">2xl 24</span></div>
  <div class="pill"><span class="lbl">pill — chips & hero input</span></div>
</body>
</html>
