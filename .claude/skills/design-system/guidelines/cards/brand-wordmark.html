<!-- @dsCard group="Brand" viewport="700x300" name="Logo & Wordmark" subtitle="Kangaroo + home mark, lockups, app icon" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 28px; display: flex; gap: 40px; align-items: center; flex-wrap: wrap; }
  .item { text-align: center; }
  .panel { display: inline-flex; align-items: center; justify-content: center; padding: 18px 26px; border-radius: var(--radius-xl); }
  .lockup { display: inline-flex; align-items: center; gap: 11px; }
  .wm { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.02em; color: var(--color-primary); font-size: 26px; }
  .cap { font-size: 12px; color: var(--text-muted); margin-top: 12px; }
  .on-teal { background: var(--color-primary); }
  .on-teal .wm { color: #fff; }
</style>
</head>
<body>
  <div class="item">
    <div class="panel" style="background:var(--secondary)">
      <div class="lockup">
        <img src="../../assets/brand/kindello-mark-clean.png" alt="Kindello mark" style="height:40px;width:auto;display:block" />
        <span class="wm">Kindello</span>
      </div>
    </div>
    <p class="cap">Primary lockup · on light</p>
  </div>
  <div class="item">
    <div class="panel on-teal">
      <div class="lockup">
        <img src="../../assets/brand/kindello-mark-white.png" alt="Kindello mark" style="height:34px;width:auto;display:block" />
        <span class="wm">Kindello</span>
      </div>
    </div>
    <p class="cap">Reversed · on teal</p>
  </div>
  <div class="item">
    <img src="../../assets/brand/kindello-mark-clean.png" alt="Kindello mark" style="height:64px;width:auto;display:block;margin:0 auto" />
    <p class="cap">Mark only</p>
  </div>
  <div class="item">
    <img src="../../assets/brand/kindello-mark.png" alt="Kindello app icon" style="width:64px;height:64px;display:block;margin:0 auto" />
    <p class="cap">App icon / favicon</p>
  </div>
</body>
</html>
