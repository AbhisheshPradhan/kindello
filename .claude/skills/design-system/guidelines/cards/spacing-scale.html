<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="4px base grid" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; display: flex; flex-direction: column; gap: 9px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .bar { height: 16px; background: var(--teal-300); border-radius: 3px; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 130px; flex: none; }
</style>
</head>
<body>
  <div class="row"><span class="lbl">--space-1 · 4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="lbl">--space-2 · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="lbl">--space-4 · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="lbl">--space-6 · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="lbl">--space-8 · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="lbl">--space-12 · 48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="lbl">--space-20 · 80</span><div class="bar" style="width:80px"></div></div>
</body>
</html>
