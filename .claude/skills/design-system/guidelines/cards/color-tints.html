<!-- @dsCard group="Colors" viewport="700x160" name="Tinted Surfaces" subtitle="Soft section bands" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 20px; }
  .row { display: flex; gap: 14px; }
  .band { flex: 1; height: 96px; border-radius: var(--radius-lg); border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; }
  .nm { font-size: 13px; font-weight: 600; }
  .vr { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .cap { font-size: 12px; color: var(--text-muted); margin-top: 10px; }
</style>
</head>
<body>
  <div class="row">
    <div class="band" style="background:var(--teal-tint)"><div class="nm" style="color:var(--teal-700)">Teal tint</div><div class="vr">--teal-tint</div></div>
    <div class="band" style="background:var(--coral-tint)"><div class="nm" style="color:var(--coral-600)">Coral tint</div><div class="vr">--coral-tint</div></div>
    <div class="band" style="background:var(--sun-tint)"><div class="nm" style="color:var(--sun-500)">Sun tint</div><div class="vr">--sun-tint</div></div>
  </div>
  <p class="cap">Used to gently separate alternating sections (Browse by type, Guides) without hard dividers.</p>
</body>
</html>
