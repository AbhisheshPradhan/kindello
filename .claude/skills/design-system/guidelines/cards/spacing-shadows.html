<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Soft warm shadows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 26px; display: flex; gap: 22px; align-items: center; background: var(--bg); }
  .card { width: 110px; height: 78px; background: #fff; border-radius: var(--radius-lg); display:flex; align-items:flex-end; justify-content:center; padding-bottom:8px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="card" style="box-shadow:var(--shadow-xs)"><span class="lbl">xs</span></div>
  <div class="card" style="box-shadow:var(--shadow-sm)"><span class="lbl">sm · card</span></div>
  <div class="card" style="box-shadow:var(--shadow-md)"><span class="lbl">md · hover</span></div>
  <div class="card" style="box-shadow:var(--shadow-lg)"><span class="lbl">lg · composer</span></div>
  <div class="card" style="box-shadow:var(--shadow-teal)"><span class="lbl" style="color:var(--teal-600)">teal glow</span></div>
</body>
</html>
