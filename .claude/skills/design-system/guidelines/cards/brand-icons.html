<!-- @dsCard group="Brand" viewport="700x170" name="Iconography — Lucide" subtitle="Lucide, 2px stroke, rounded" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 24px; }
  .grid { display: flex; flex-wrap: wrap; gap: 14px; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 72px; }
  .ic span { width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--secondary); display: flex; align-items: center; justify-content: center; color: var(--teal-600); }
  .ic svg { width: 22px; height: 22px; stroke-width: 2; }
  .ic small { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .cap { font-size: 12px; color: var(--text-muted); margin-top: 14px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="ic"><span><i data-lucide="sparkles"></i></span><small>sparkles</small></div>
    <div class="ic"><span><i data-lucide="map-pin"></i></span><small>map-pin</small></div>
    <div class="ic"><span><i data-lucide="star"></i></span><small>star</small></div>
    <div class="ic"><span><i data-lucide="clock"></i></span><small>clock</small></div>
    <div class="ic"><span><i data-lucide="users"></i></span><small>users</small></div>
    <div class="ic"><span><i data-lucide="phone"></i></span><small>phone</small></div>
    <div class="ic"><span><i data-lucide="heart"></i></span><small>heart</small></div>
    <div class="ic"><span><i data-lucide="shield-check"></i></span><small>shield-check</small></div>
    <div class="ic"><span><i data-lucide="search"></i></span><small>search</small></div>
    <div class="ic"><span><i data-lucide="arrow-up"></i></span><small>arrow-up</small></div>
  </div>
  <p class="cap">Lucide icon set (the app's icon library), 2px stroke, rounded caps. Carried over CDN. No emoji in product UI.</p>
  <script>lucide.createIcons();</script>
</body>
</html>
